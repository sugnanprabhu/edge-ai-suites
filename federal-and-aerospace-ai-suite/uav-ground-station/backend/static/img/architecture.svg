<svg width="860" height="320" viewBox="0 0 860 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8a97a6" />
    </marker>
  </defs>
  <rect width="860" height="320" fill="#0b0f14" />

  <!-- Remote viewer machine -->
  <rect x="20" y="20" width="360" height="280" rx="10" fill="#121820" stroke="#212b36" />
  <text x="40" y="45" fill="#e6edf3" font-size="14" font-weight="600">Viewer machine (this stack)</text>

  <rect x="40" y="65" width="320" height="60" rx="8" fill="#0d1117" stroke="#1a73e8" />
  <text x="55" y="90" fill="#e6edf3" font-size="13">viz-backend (FastAPI)</text>
  <text x="55" y="108" fill="#8a97a6" font-size="11">UI + metrics/caption proxy + connect API</text>

  <rect x="40" y="140" width="320" height="60" rx="8" fill="#0d1117" stroke="#1a73e8" />
  <text x="55" y="165" fill="#e6edf3" font-size="13">mediamtx</text>
  <text x="55" y="183" fill="#8a97a6" font-size="11">RTSP → WebRTC (WHEP), on-demand pull</text>

  <rect x="40" y="215" width="320" height="60" rx="8" fill="#0d1117" stroke="#2ea043" />
  <text x="55" y="240" fill="#e6edf3" font-size="13">Browser dashboard</text>
  <text x="55" y="258" fill="#8a97a6" font-size="11">video + captions + utilization + info</text>

  <!-- UAV host machine -->
  <rect x="480" y="20" width="360" height="280" rx="10" fill="#121820" stroke="#212b36" />
  <text x="500" y="45" fill="#e6edf3" font-size="14" font-weight="600">UAV host machine (uav-vision-analytics)</text>

  <rect x="500" y="65" width="320" height="50" rx="8" fill="#0d1117" stroke="#212b36" />
  <text x="515" y="95" fill="#e6edf3" font-size="12">nginx (TLS, RTSP + MQTT passthrough)</text>

  <rect x="500" y="125" width="150" height="50" rx="8" fill="#0d1117" stroke="#212b36" />
  <text x="513" y="155" fill="#e6edf3" font-size="11">DL Streamer Pipeline Server</text>

  <rect x="670" y="125" width="150" height="50" rx="8" fill="#0d1117" stroke="#212b36" />
  <text x="683" y="155" fill="#e6edf3" font-size="11">metrics-manager</text>

  <rect x="500" y="185" width="150" height="50" rx="8" fill="#0d1117" stroke="#212b36" />
  <text x="513" y="215" fill="#e6edf3" font-size="11">mosquitto (MQTT)</text>

  <rect x="670" y="185" width="150" height="50" rx="8" fill="#0d1117" stroke="#212b36" />
  <text x="683" y="208" fill="#e6edf3" font-size="11">PX4 SITL / camera</text>
  <text x="683" y="223" fill="#8a97a6" font-size="10">+ VLM scene captioning</text>

  <!-- Arrows between machines -->
  <line x1="360" y1="95" x2="500" y2="90" stroke="#8a97a6" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="370" y="85" fill="#8a97a6" font-size="10">HTTPS (pipeline/metrics)</text>

  <line x1="360" y1="170" x2="500" y2="90" stroke="#8a97a6" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="370" y="170" fill="#8a97a6" font-size="10">RTSP pull (on connect)</text>

  <line x1="360" y1="100" x2="500" y2="210" stroke="#8a97a6" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="365" y="300" fill="#8a97a6" font-size="10">MQTT subscribe (captions)</text>
</svg>
