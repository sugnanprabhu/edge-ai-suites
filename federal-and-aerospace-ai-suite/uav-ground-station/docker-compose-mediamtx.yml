#
# OPT-IN overlay enabling the legacy "WebRTC - Relay" stream mode (see
# docker-compose.yml and backend/main.py's /api/stream/webrtc-path /
# _WebrtcRelay). Only needed as a fallback for a remote pipeline with no
# native WebRTC destination (e.g. a base/non-caption pipeline) -- the
# default "WebRTC - Direct" mode needs nothing beyond docker-compose.yml.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose-mediamtx.yml up -d --build
###############################################################################

services:

  # Opt-in WebRTC relay target: viz-backend's ffmpeg relay *pushes* a
  # transcoded H.264 RTSP stream into this container (internal-only RTSP
  # ingest, see configs/mediamtx.yml's "rtsp"/"all_others" settings), which
  # mediamtx then serves to the browser over WebRTC/WHEP. mediamtx itself
  # never pulls from the remote UAV host and never transcodes -- see
  # backend/main.py's /api/stream/webrtc-path.
  mediamtx:
    image: bluenviron/mediamtx:1.21.2
    # No `container_name` here (unlike viz-backend) -- Compose only keeps a
    # service reachable by its service name ("mediamtx", used by
    # MEDIAMTX_API_BASE / MEDIAMTX_RTSP_BASE) on the default network when no
    # custom container_name is set.
    volumes:
      - ./configs/mediamtx.yml:/mediamtx.yml:ro
    environment:
      # ICE candidates must advertise an address the *browser* can actually
      # reach. Leave unset to let mediamtx auto-advertise its own detected
      # interface IPs (webrtcIPsFromInterfaces, on by default) -- only set
      # this if that auto-detection picks the wrong interface or this host
      # is behind NAT (e.g. set it to this machine's LAN/public IP).
      # NOTE: do NOT set this to VIZ_HOST_IP when VIZ_HOST_IP=0.0.0.0 (a bind
      # address, not a reachable one) -- that would advertise an invalid,
      # unreachable ICE candidate to every browser.
      - MTX_WEBRTCADDITIONALHOSTS=${VIZ_PUBLIC_HOST:-}
    ports:
      - "${VIZ_HOST_IP:-127.0.0.1}:${MEDIAMTX_WEBRTC_PORT:-8889}:8889"
      - "${VIZ_HOST_IP:-127.0.0.1}:${MEDIAMTX_WEBRTC_ICE_UDP_PORT:-8189}:8189/udp"
    restart: on-failure:5

  viz-backend:
    depends_on:
      - mediamtx
