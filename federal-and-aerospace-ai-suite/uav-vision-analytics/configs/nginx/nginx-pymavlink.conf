#
# Nginx reverse proxy / TLS termination for the Standalone (pymavlink) stack.
# Uses self-signed cert, HTTP->HTTPS redirect, hardened TLS.
#
# This is the only service that publishes ports to the host. All backend
# services (dlstreamer-pipeline-server, metrics-manager) are reachable only
# on the internal `app_network` Docker network.
#
#   https://<HOST_IP>/                         -> DL Streamer Pipeline Server REST API (8081)
#   https://<HOST_IP>/metrics/stream           -> metrics-manager SSE stream (9090)
#   https://<HOST_IP>/api/v1/metrics/latest    -> metrics-manager REST snapshot (9090)
#   https://<HOST_IP>/webrtc/<peer-id>         -> WebRTC (WHEP) signaling, proxied to mediamtx --
#                                                  bundled under the same 443 port so clients don't
#                                                  need a dedicated port open just for signaling.
#   rtsp://<HOST_IP>:8555/...                  -> DL Streamer annotated RTSP stream
#   mqtt://<HOST_IP>:1883                      -> mosquitto broker (scene captions, CAPTION=true)
#   udp+tcp/<HOST_IP>:8189                     -> WebRTC media/ICE (mediamtx) -- published
#                                                  directly by the mediamtx container itself
#                                                  (not proxied by nginx; a generic UDP stream
#                                                  relay was unreliable for long-lived media).
#                                                  TCP is an additional ICE candidate for
#                                                  clients whose network blocks/throttles UDP.
#   udp/<HOST_IP>:3478                         -> STUN/TURN (coturn, host-networked directly --
#                                                  not proxied by nginx; includes its ephemeral
#                                                  relay port range), NAT traversal fallback

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream dlstreamer {
        server dlstreamer-pipeline-server:8081;
    }

    upstream metrics_manager {
        server metrics-manager:9090;
    }

    # mediamtx's WHEP signaling is plain HTTP -- proxied here (instead of a
    # raw stream{} TCP passthrough on its own port) so viewers only need the
    # same 443 port already open for everything else. ICE/UDP media (8189)
    # still needs its own port -- that's WebRTC's media plane, not HTTP, and
    # cannot be tunneled through an HTTP(S) reverse proxy.
    upstream mediamtx {
        server mediamtx:8889;
    }

    # HTTP server - redirect to HTTPS
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name localhost;

        # Pipeline start/stop requests are small JSON payloads; 50M is
        # generous headroom — no file-upload endpoint exists here.
        client_max_body_size 50M;

        # SSL configuration
        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # SSL security settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-XSS-Protection "1; mode=block";

        # metrics-manager — SSE stream
        location /metrics/ {
            proxy_pass         http://metrics_manager/metrics/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # Required for the metrics SSE stream
            proxy_buffering      off;
            proxy_cache          off;
            proxy_read_timeout   3600s;
        }

        # metrics-manager — REST snapshot
        location /api/v1/metrics/ {
            proxy_pass         http://metrics_manager/api/v1/metrics/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # mediamtx — WebRTC WHEP signaling (SDP offer/answer, ICE-trickle
        # PATCH, session-teardown DELETE). The trailing slashes on both the
        # location and proxy_pass mean the '/webrtc/' prefix is stripped
        # before forwarding, so 'https://host/webrtc/<peer-id>/whep' reaches
        # mediamtx as '/<peer-id>/whep'. mediamtx is unaware of the
        # '/webrtc/' prefix, so its WHEP session 'Location' response header
        # (used by the browser for subsequent ICE-trickle PATCH and
        # session-teardown DELETE requests) comes back as a root-relative
        # path with no prefix, e.g. '/uav-mavlink-cpu/whep/<id>'. Without
        # rewriting, the browser resolves that against the site origin and
        # misses this location block entirely (404s against the / location
        # below), breaking playback a moment after it starts. proxy_redirect
        # re-adds the '/webrtc/' prefix to that header so follow-up requests
        # come back through this same proxied path.
        location /webrtc/ {
            proxy_pass         http://mediamtx/;
            proxy_redirect     / /webrtc/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # DL Streamer Pipeline Server — REST API (pipeline control and status)
        location / {
            proxy_pass         http://dlstreamer/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }
    }
}

# RTSP and MQTT are not HTTP protocols and cannot be terminated by the http {}
# block above — the stream {} module gives them raw TCP passthrough on the
# same nginx container so the backend containers themselves stay unexposed.
stream {
    server {
        listen 8555;
        proxy_pass dlstreamer-pipeline-server:8555;
    }

    # mosquitto broker — only needed to observe/test scene captions
    # (CAPTION=true) from outside the Docker network, e.g. via mosquitto_sub
    # from the host. MQTT has no TLS here (matches the broker's own config);
    # treat this port as trusted-network-only, same as the RTSP passthrough.
    server {
        listen 1883;
        proxy_pass broker:1883;
    }

    # mediamtx's WHIP (pipeline server publish, internal-only) / WHEP (viewer,
    # external) HTTP signaling is now reverse-proxied under the https{}
    # server's /webrtc/ location above (bundled into port 443) instead of a
    # dedicated TCP passthrough port here -- see that location's comment.

    # WebRTC media/ICE (mediamtx's single UDP mux port) is no longer
    # proxied here -- nginx's generic stream{} UDP relay re-sources packets
    # under its own container IP and silently drops long-lived WebRTC media
    # sessions after a few seconds (observed: ICE pairs successfully, then
    # "peer connection closed" almost immediately). mediamtx now publishes
    # 8189/udp directly via Docker's port mapping instead -- a proper
    # kernel-level DNAT with no idle-session relay in the middle.

    # coturn STUN/TURN is no longer proxied here -- coturn runs with
    # network_mode: host (see docker-compose-pymavlink.yml) so its control
    # port (3478/udp) *and* its ephemeral TURN relay port range bind
    # directly to this host's real interface. A bridge-network passthrough
    # here would only forward 3478 itself, not the relay range TURN
    # allocates from, which defeats the point of using TURN at all.
}
