services:

  broker:
    image: docker.io/library/eclipse-mosquitto:2.0.22
    container_name: broker
    environment:
      - http_proxy=${http_proxy}
      - https_proxy=${https_proxy}
      - no_proxy=${no_proxy},${HOST_IP}
      - NO_PROXY=${no_proxy},${HOST_IP}
    volumes:
      - ./configs/mosquitto:/mosquitto/config
    networks:
      - app_network
    restart: on-failure:5

  px4:
    image: px4io/px4-sitl:latest
    hostname: px4-sitl
    container_name: px4
    volumes:
      - ./10040_sihsim_quadx.post:/opt/px4/etc/init.d-posix/airframes/10040_sihsim_quadx.post
    stdin_open: true
    tty: true
    networks:
      - app_network
    depends_on:
       - mavlink-router
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mavlink-router:
    build:
      context: ../uav-mission-compute-sdk/infra/px4-sim/mavlink-router
      dockerfile: Dockerfile
      args:
        http_proxy:  ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy:    ${no_proxy:-localhost,127.0.0.0/8}
        NO_PROXY:    ${NO_PROXY:-localhost,127.0.0.0/8}
    container_name: mavlink-router
    restart: unless-stopped
    volumes:
      - ./configs/mavlink-router/main.conf:/etc/mavlink-router/main.conf
    networks:
      - app_network

  dlstreamer-pipeline-server:
    build:
      context: .
      dockerfile_inline: |
        FROM ${DLSTREAMER_PIPELINE_SERVER_IMAGE}
        RUN pip install --no-cache-dir pymavlink
    image: ${DLSTREAMER_PIPELINE_SERVER_IMAGE}-pymavlink
    pull_policy: build
    container_name: dlstreamer-pipeline-server
    environment:
      - http_proxy=${http_proxy}
      - https_proxy=${https_proxy}
      - no_proxy=${no_proxy},${HOST_IP},host.docker.internal,mediamtx,coturn
      - NO_PROXY=${no_proxy},${HOST_IP},host.docker.internal,mediamtx,coturn
      - ENABLE_WEBRTC=true
      - ENABLE_RTSP=true
      - RTSP_PORT=8555
      # WHIP (publish) endpoint the pipeline server posts its SDP offer to;
      # mediamtx then serves viewers over WHEP at the same host:port/<peer-id>.
      - WEBRTC_SIGNALING_SERVER=http://mediamtx:8889
      - APPEND_PIPELINE_NAME_TO_PUBLISHER_TOPIC=true
      - RUN_MODE=EVA
      - EMIT_SOURCE_AND_DESTINATION=true
      - REST_SERVER_PORT=8081
      - SERVICE_NAME=dlstreamer-pipeline-server
      - MQTT_HOST=broker
      - MQTT_PORT=1883
      - ENABLE_OPEN_TELEMETRY=true
      # NPU related environment variables
      - ZE_ENABLE_ALT_DRIVERS=libze_intel_npu.so
      - NPU_DEVICE=${NPU_DEVICE:-/dev/null}
    volumes:
      - dlstreamer-pipeline-server-pipeline-root:/var/cache/pipeline_root:uid=1999,gid=1999
      - "./resources:/home/pipeline-server/resources"
      - "./configs/config-pymavlink.json:/home/pipeline-server/config.json"
      - "./gvapython/telemetry-overlay-pymavlink.py:/home/pipeline-server/gvapython/telemetry-overlay-pymavlink.py"
      - "./scripts/mavlink_pipeline_manager.py:/home/pipeline-server/scripts/pipeline_manager.py"
      - "/run/udev:/run/udev:ro"
      - "/tmp:/tmp"
      - "${REALSENSE_DEVICE:-/dev/null}:/dev/video4"
    group_add:
      - "44"
      - "109"
      - "110"
      - "990"
      - "992"
      - "993"
      - "994"
      - "996"
    device_cgroup_rules:
      - "c 189:* rmw"
      - "c 209:* rmw"
      - "a 189:* rwm"
    devices:
      - ${GPU_DEVICE:-/dev/dri/card0}:${GPU_DEVICE:-/dev/dri/card0}
      - ${GPU_RENDER_DEVICE:-/dev/dri/renderD128}:${GPU_RENDER_DEVICE:-/dev/dri/renderD128}
      - ${NPU_DEVICE:-/dev/null}:${NPU_DEVICE:-/dev/null}
    networks:
      - app_network
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 5
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mediamtx

  # WebRTC signaling/media server for the pipeline server's WHIP publisher
  # (ENABLE_WEBRTC=true above) and viewers' WHEP playback. HTTP signaling
  # stays internal -- nginx reverse-proxies WHEP under its HTTPS /webrtc/
  # location (bundled into port 443). The UDP/ICE media port (8189) is
  # published directly below instead of proxied by nginx: nginx's generic
  # stream{} UDP relay re-sources packets under its own container IP and
  # silently closes long-lived WebRTC media sessions after a few seconds,
  # whereas a direct Docker port publish is a proper kernel-level DNAT.
  mediamtx:
    image: bluenviron/mediamtx:1.15.6
    container_name: mediamtx
    environment:
      - http_proxy=${http_proxy}
      - https_proxy=${https_proxy}
      - no_proxy=${no_proxy},${HOST_IP},mediamtx,coturn
      - NO_PROXY=${no_proxy},${HOST_IP},mediamtx,coturn
      - MTX_LOGLEVEL=info
      - MTX_API=no
      - MTX_RTSP=no
      - MTX_RTMP=no
      - MTX_SRT=no
      - MTX_HLS=no
      - MTX_WEBRTCTRACKGATHERTIMEOUT=30s
      - MTX_WEBRTCADDRESS=:8889
      # Advertise the host as a direct ICE candidate so LAN clients connect
      # peer-to-peer; coturn below remains the NAT-traversal fallback.
      - MTX_WEBRTCADDITIONALHOSTS=${HOST_IP:-127.0.0.1}
      # ICE-TCP candidate (in addition to the default UDP mux on the same
      # port number): many VPN/corporate-firewall paths that block or
      # throttle arbitrary UDP still allow outbound TCP, so this gives
      # remote viewers another, more NAT-friendly candidate pair to try
      # alongside the UDP host candidate and the TURN relay. Matches the
      # working reference in metro-vision-ai-app-recipe.
      - MTX_WEBRTCLOCALTCPADDRESS=:8189
      - MTX_WEBRTCICESERVERS2_0_URL=turn:${HOST_IP:-127.0.0.1}:3478
      - MTX_WEBRTCICESERVERS2_0_USERNAME=${MTX_WEBRTCICESERVERS2_0_USERNAME:-localhost}
      - MTX_WEBRTCICESERVERS2_0_PASSWORD=${MTX_WEBRTCICESERVERS2_0_PASSWORD:-localpass}
    ports:
      - "${HOST_IP:-127.0.0.1}:8189:8189/udp"
      - "${HOST_IP:-127.0.0.1}:8189:8189/tcp"
    restart: unless-stopped
    networks:
      - app_network

  coturn:
    image: coturn/coturn:4.12
    container_name: coturn
    environment:
      - http_proxy=${http_proxy}
      - https_proxy=${https_proxy}
      - no_proxy=${no_proxy},${HOST_IP},mediamtx,coturn
      - NO_PROXY=${no_proxy},${HOST_IP},mediamtx,coturn
    # Long-term-credential TURN relay, matching mediamtx's
    # MTX_WEBRTCICESERVERS2_0_USERNAME/PASSWORD above. Without matching
    # credentials here, coturn challenges every allocation with 401 and the
    # browser's TURN fallback never completes -- so viewers on a different
    # network/NAT than this host (VPN, remote LAN, etc.) can signal fine but
    # never actually receive media once direct UDP host-candidates are
    # blocked by their own firewall/NAT.
    #
    # network_mode: host (instead of the bridged app_network + a single
    # published 3478/udp port) is required for the TURN *relay* itself to
    # work from outside this host's LAN/NAT: once a client allocates a
    # relay, coturn by default hands out a port from a large ephemeral range
    # (--min-port/--max-port, 49152-65535 unless narrowed) for the actual
    # media flow -- Docker's bridge-network port mapping only forwards the
    # single 3478 control port, so none of those relay ports would be
    # reachable and ICE would keep timing out even though the TURN
    # ALLOCATE/REFRESH handshake itself succeeds. Host networking lets the
    # whole relay range bind directly to the host's real interface, which is
    # the standard fix for coturn-in-Docker. HOST_IP (not the "coturn"
    # hostname) is what mediamtx/clients already address it by, so this is
    # a safe, self-contained change.
    network_mode: host
    command: [
      "-v",
      "--listening-port=3478",
      "--realm=mediamtx",
      "--lt-cred-mech",
      "--user=${MTX_WEBRTCICESERVERS2_0_USERNAME:-localhost}:${MTX_WEBRTCICESERVERS2_0_PASSWORD:-localpass}",
      "--external-ip=${HOST_IP:-127.0.0.1}",
      "--no-cli",
      "--no-tls",
      "--no-dtls",
    ]

  metrics-manager:
    image: intel/metrics-manager:2026.2.0
    container_name: metrics-manager
    privileged: true
    pid: host
    devices:
      - /dev/dri            # Intel GPU — card0 + renderD128 required for qmassa
    volumes:
      - /sys:/sys:ro
    restart: unless-stopped
    networks:
      - app_network

  # Nginx reverse proxy / TLS — the only service that publishes
  # ports to the host. Binds to HOST_IP (falls back to loopback-only when
  # HOST_IP is unset) rather than all interfaces.
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    volumes:
      - ./configs/nginx/nginx-pymavlink.conf:/etc/nginx/nginx.conf:ro
      - ./configs/nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "${HOST_IP:-127.0.0.1}:80:80"
      - "${HOST_IP:-127.0.0.1}:443:443"
      - "${HOST_IP:-127.0.0.1}:8555:8555"
      - "${HOST_IP:-127.0.0.1}:1883:1883"
      # WebRTC: WHEP signaling is proxied under 443 (see nginx's /webrtc/
      # location). mediamtx's UDP/ICE media port (8189) is published
      # directly by the mediamtx service instead of passed through here --
      # see the mediamtx service comment for why. coturn's STUN/TURN port
      # (3478/udp) is bound directly by coturn itself via network_mode:
      # host, not nginx.
    networks:
      - app_network
    depends_on:
      - dlstreamer-pipeline-server
      - metrics-manager
      - broker
      - mediamtx
      - coturn

networks:
  app_network:
    driver: "bridge"

volumes:
  dlstreamer-pipeline-server-pipeline-root:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
